<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Obect Model Manipulation 2</title>
</head>
<body style="background-color: #000; color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName) {
       const li = document.createElement('li');
       li.innerText = `${langName}`;
       document.querySelector('.language').appendChild(li);
    }

    function addOptimizedWayLang(langName) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
    }

    addOptimizedWayLang('GO');
    addOptimizedWayLang('Ruby');
 
    addLanguage('Python');
    addLanguage('C++');
    addLanguage('TypeScript');

    // Edit element

    const secondLang = document.querySelector('li:nth-child(2)');
    // secondLang.innerHTML = 'Mojo';

    const newLi = document.createElement('li');
    newLi.textContent = 'Mojo';
    secondLang.replaceWith(newLi);


    // Remove element

    const lantLang = document.querySelector('li:last-child');
    lantLang.remove();

</script>
</html>
